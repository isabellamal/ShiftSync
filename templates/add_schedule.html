<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSync - Add Shift</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f3ef; --surface: #ffffff; --border: #e0ddd6;
      --accent: #2d6a4f; --accent-light: #d8f3dc; --accent2: #e76f51;
      --text: #1a1a1a; --muted: #7a7a72; --radius: 14px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    nav { background: var(--surface); border-bottom: 1.5px solid var(--border); padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-family: 'Syne', sans-serif; font-size: 1.35rem; font-weight: 800; color: var(--accent); }
    .nav-logo span { color: var(--accent2); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .btn-logout { background: transparent; border: 1.5px solid var(--border); border-radius: 8px; padding: 6px 14px; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-logout:hover { border-color: var(--accent2); color: var(--accent2); }
    main { flex: 1; padding: 2rem; max-width: 640px; width: 100%; margin: 0 auto; }
    .page-header { margin-bottom: 1.75rem; }
    .page-header h1 { font-family: 'Syne', sans-serif; font-size: 1.75rem; font-weight: 800; }
    .page-header p { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .back-link { font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 1.5rem; }
    .back-link:hover { text-decoration: underline; }
    .card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 3rem;}

    label { color: var(--muted); font-weight: 600; }
    input {
        width: 100%;
        padding: 10px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        margin-top: 0.35rem;
        font-family: 'DM Sans', sans-serif;
        font-size: 0.95rem;
    }

    .btn-submit {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-family: 'DM Sans', sans-serif;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    .card h2 { font-family: 'Syne', sans-serif; font-size: 1.1rem; margin-bottom: 2rem; }

    .shift-row { display: flex; align-items: center; justify-content: space-between; text-align: left; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .shift-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

    .shift-info { display: flex; align-items: center; gap: 1rem;}
    .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; display: inline-block; }
    .shift-date { font-weight: 700; color: var(--text); }
    .shift-text { color: var(--muted); }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">Shift<span>Sync</span></div>
  <div class="nav-right">
    <a href="{{ url_for('logout') }}" class="btn-logout">Log out</a>
  </div>
</nav>

<main>
    <a href="{{ url_for('admin_edit_schedule') }}" class="back-link">← Back to Edit Schedule</a>
<div class="page-header">
    <h1>Add New Shift</h1>
    <p>Create a scheduled shift for an employee.</p>
</div>

<div class="card">

<form method="POST">
    <label>Employee ID:</label>
    <input type="text" name="employee_id">

    <label>Day:</label>
    <input type="date" name="day" required>

    <label>Start Time:</label>
    <input type="time" name="start" required>

    <label>End Time:</label>
    <input type="time" name="end" required>

    <button type="submit" class="btn-submit">Add Shift</button>
    </form>
  </div>
</main>

</body>
</html>
