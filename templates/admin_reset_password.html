<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShiftSync - Admin Reset Password</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f3ef;
      --surface: #ffffff;
      --border: #e0ddd6;
      --accent: #2d6a4f;
      --accent2: #e76f51;
      --text: #1a1a1a;
      --muted: #7a7a72;
      --radius: 14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }

    nav {
        background-color: var(--surface);
        border-bottom: 1.5px solid var(--border);
        padding: 0 2rem;
        height: 60px;
        display: flex;
        align-items: center;
    }

    .nav-logo {
        font-family: 'Syne', sans-serif;
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--accent);
    }

    .nav-logo span {
        color: var(--accent2);
    }

    main {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 60px);
    }

    .form-card {
        background: var(--surface);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        padding: 2rem;
        width: 350px;
    }

    h2 {
        font-family: 'Syne', sans-serif;
        margin-bottom: 1rem;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        margin-bottom: 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        font-family: 'DM Sans', sans-serif;
    }

    .btn {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        background: var(--accent);
        color: white;
    }

    .btn:hover {
        background: #245a41;
    }

    .error {
        color: var(--accent2);
        font-size: 0.85rem;
        margin-bottom: 1rem;
    }
  </style>
</head>
<body>
<nav>
    <div class="nav-logo">Shift<span>Sync</span></div>
</nav>

<main>
    <div class="form-card">
        <h2> Change Admin Password</h2>
        <p style="color: var(--muted); font-size: 0.9rem;">Admin ID: <strong>{{ admin }}</strong></p>
        
        {% if msg %}
            <div class="error"> {{ msg }}</div>
        {% endif %}

        <form method="POST">
            <label>Current Password</label>
            <input type="password" name="current_password" required>

            <label>New Password</label>
            <input type="password" name="new_password" required>

            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required>

            <button type="submit" class="btn">Update Password</button>
        </form>
    </div>
</main>
</body>
</html>
