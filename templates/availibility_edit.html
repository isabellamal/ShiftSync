<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShiftSync - Edit Availability</title>
</head>
<body>
  <h1>Edit Availability</h1>
  <p><a href="{{ url_for('availability') }}">Back</a></p>

  {% if msg %}
    <p style="color:red;">{{ msg }}</p>
  {% endif %}

  <form method="POST">
    <label>Day</label>
    <select name="day" required>
      {% for d in days %}
        <option value="{{ d }}" {% if d == record[1] %}selected{% endif %}>{{ d }}</option>
      {% endfor %}
    </select>

    <label>Start</label>
    <select name="start" required>
      {% for t in times %}
        <option value="{{ t }}" {% if t == record[2] %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>

    <label>End</label>
    <select name="end" required>
      {% for t in times %}
        <option value="{{ t }}" {% if t == record[3] %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>

    <button type="submit">Save Changes</button>
  </form>
</body>
</html>
